name: Publish SDK

on:
  workflow_dispatch:
    inputs:
      sdk-version:
        description: 'SDK version to publish (e.g. v0.1.0, or leave empty to use HEAD)'
        required: false
        type: string

jobs:
  publish-sdk:
    name: Publish herald-sdk to crates.io
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      SCCACHE_DISABLE: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-sdk-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sdk-

      - name: Publish herald-sdk
        working-directory: backend
        run: cargo publish -p herald-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
