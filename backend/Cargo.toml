[workspace]
resolver = "3"
members = [
    "entity",
    "domain",
    "infra",
    "infra-creem",
    "infra-stripe",
    "infra-wechat",
    "infra-shopify",
    "core",
    "api-base",
    "api-billing",
    "api-admin",
    "api-auth",
    "api-ext",
    "api-oauth",
    "api-points",
    "api",
    "worker",
    "app",
    "sdk",
    "test-db",
    "test-support",
    "integration-tests",
]

[workspace.package]
#name = "herald"
version = "0.1.0"
authors = ["Timzaak <zsy.evan@gmail.com>"]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-valid = { version = "0.24" }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "request-id"] }
hyper = { version = "1.5", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"

# Database
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "postgres", "uuid", "migrate"] }

# Authentication & Encryption
bcrypt = "0.17"
hmac = "0.12"
sha2 = "0.10"

# Time & ID
chrono = { version = "0.4", features = ["serde"] }
# ⚠️ UUID v7 ONLY: We use UUID v7 for better database index locality and performance
# v7 is time-ordered and monotonic, unlike v4 which is random
uuid = { version = "1.19", features = ["v7", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
toml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
dotenv = "0.15"

# API Documentation
utoipa = { version = "5.4", features = ["axum_extras", "uuid", "chrono", "openapi_extensions"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

# Validation
validator = { version = "0.20", features = ["derive"] }

# External Services
redis = { version = "1.0.1", features = ["connection-manager", "tokio-comp", "aio"] }
resend-rs = { version = "0.19" }
reqwest = { version = "0.12.26", features = ["json"] }

# OAuth
oauth2 = "5"
# ⚠️ DO NOT RE-ADD async-trait: We use native async fn in traits instead (Rust 1.75+)
# async-trait = "0.1"
base64 = "0.22"
jsonwebtoken = "9.3"

# Networking
ipnetwork = "0.21"

# Testing
testcontainers-modules = { version = "0.14", features = ["postgres", "redis"] }
testcontainers = "0.26"
test-context = "0.5.4"
tempfile = "3"
mockito = "1.2"
wiremock = "0.6"

# In-memory caching
moka = { version = "0.12", features = ["future"] }
once_cell = "1.20"

# Async utilities
dashmap = "6.1"
mockall = "0.14"

# Random
rand = "0.8"

# URL encoding
urlencoding = "2.1"

# TOTP
totp-lite = "2.0"
aes-gcm = "0.10"
base32 = "0.5"
hex = "0.4"

# URL parsing
url = "2.5"

# Async utilities
futures = "0.3"
