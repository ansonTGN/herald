# Cargo Configuration
# Optimized for development iteration speed

[target.x86_64-pc-windows-msvc]
# 使用 Rust 自带的 LLD 链接器
linker = "rust-lld.exe"

[build]
rustc-wrapper = "sccache"

# Use all available CPU cores for parallel compilation
jobs = 8

[profile.dev]
# Development profile - prioritize compilation speed
split-debuginfo = "unpacked"
# 关闭 incremental，让 sccache 可以缓存
incremental = false
codegen-units = 64

[profile.release]
# Release profile - prioritize runtime performance
opt-level = 3
lto = "thin"
#codegen-units = 16

[profile.test]
# Test profile - prioritize compilation speed
opt-level = 0
debug = "line-tables-only"
incremental = false
codegen-units = 64
strip = "debuginfo"

[net]
git-fetch-with-cli = true

[http]
check-revoke = false
