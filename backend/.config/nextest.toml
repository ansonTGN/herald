[profile.default]
# A test is "slow" after one 5-minute period and is then terminated.
slow-timeout = { period = "300s", terminate-after = 1 }
# Global timeout covering the full ~1648-test suite (integration scenarios with
# real PostgreSQL/Redis make it heavy). 879 tests took ~64m on CI, so 150m leaves
# headroom for cold runners; tune down once the suite is sped up.
global-timeout = "150m"
# Default parallel test threads
test-threads = 8
# 立即显示失败输出
failure-output = "immediate"
# 测试失败后立即停止
fail-fast = false
