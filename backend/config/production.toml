# Herald Production Configuration
# This file is used as the default config inside Docker images.
# Override at runtime via volume mount: -v /path/to/your-config.toml:/app/config.toml:ro

[database]
# Connection pool settings for production workloads.
# URL is typically overridden by environment variable at deploy time.
url = "postgresql://herald:herald@db:5432/herald"
max_connections = 50
acquire_timeout_secs = 10
idle_timeout_secs = 300
max_lifetime_secs = 1800
connect_timeout_secs = 5

[redis]
url = "redis://redis:6379"

[server]
bind_address = "0.0.0.0:3000"
log_level = "info"
app_env = "production"

[frontend]
# CORS allowlist origin. Change to your actual domain in production.
url = "http://localhost:3000"
# Serve frontend SPA from this directory inside the container.
# The Docker image bundles frontend/dist at this path.
static_dir = "/app/frontend/dist"

[jwt]
# MUST be overridden at deploy time. Use: openssl rand -base64 48
secret = "change-me-in-production"

# [custom_domain] — required for the Caddy On-Demand TLS ask gate.
# ask_key MUST be overridden at deploy time with a high-entropy shared
# secret (it gates /api/internal/custom-domain/authorize via X-Herald-Ask-Key).
# cname_target is the Herald-owned hostname tenants CNAME to; override per
# deployment. See design §4.2.2 and backend/api/src/lib.rs:164 startup guard.
[custom_domain]
ask_key = "change-me-in-production"
cname_target = "custom.example.com"

# [google_oauth] — Google One Tap (GIS ID Token) login JWKS source. Override
# only if routing through a corporate JWKS cache/proxy; otherwise the real
# Google endpoint is correct.
[google_oauth]
jwks_url = "https://www.googleapis.com/oauth2/v3/certs"
