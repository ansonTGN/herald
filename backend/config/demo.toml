# =============================================================================
# Herald Demo Environment Configuration
# =============================================================================

[database]
url = "postgres://postgres:postgres@127.0.0.1:5432/herald_demo?sslmode=disable"

[redis]
url = "redis://127.0.0.1:6379/0"

[server]
bind_address = "0.0.0.0:8080"
log_level = "info"
app_env = "demo"

[frontend]
url = "http://localhost:3000"
static_dir = "../frontend/dist"

[jwt]
secret = "YWJjZGVmZ2hpamtsbW5vcHFydXN0dXZ3eHl6MDEyMzQ1Njc4OTA="

# Custom-domain global settings (CustomDomainSettingsConfig,
# backend/api/src/config.rs:98-108). Required for the demo backend to boot: the
# startup guard at backend/api/src/lib.rs:164-171 rejects an empty `ask_key`.
# `cname_target` is surfaced to realm admins as `cnameTarget` in the GET
# /api/realms/{realm}/config/custom-domain response and rendered in the
# custom-domain CNAME guidance panel.
[custom_domain]
ask_key = "demo-custom-domain-ask-key"
cname_target = "custom.demo.herald.local"

# [google_oauth] — Google One Tap (GIS ID Token) login JWKS source. Read via
# AppState.google_jwks_url by `verify_google_id_token` to validate One Tap ID
# Token signatures.
[google_oauth]
jwks_url = "https://www.googleapis.com/oauth2/v3/certs"
