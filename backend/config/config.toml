[database]
url = "postgres://postgres:postgres@localhost/herald?sslmode=disable"
max_connections = 100
acquire_timeout_secs = 30
idle_timeout_secs = 600
max_lifetime_secs = 1800
connect_timeout_secs = 10

[redis]
url = "redis://127.0.0.1:6379/1"

[server]
bind_address = "0.0.0.0:8080"
log_level = "info"
app_env = "demo"

[frontend]
url = "http://localhost:3000"
# static_dir = "../frontend/dist"

[jwt]
secret = "change-me-to-a-secure-random-base64-string"

# Custom-domain global settings (CustomDomainSettingsConfig,
# backend/api/src/config.rs:97-108). Required for the local-dev backend to boot:
# the startup guard at backend/api/src/lib.rs:164 rejects an empty `ask_key`.
[custom_domain]
ask_key = "dev-custom-domain-ask-key"
cname_target = "custom.localhost"

[observability]
service_name = "herald-api"
otlp_endpoint = "http://localhost:4318"
metrics_export_interval_secs = 5
traces_enabled = false
sqlx_slow_statement_ms = 200
