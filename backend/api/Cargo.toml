[package]
name = "herald-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "herald_api"
path = "src/lib.rs"

[features]
# All features default-off. Phase 2 profiling gates:
# implementation is intentionally NOT wired in main.rs this phase.
default = []
tokio-console = ["dep:console-subscriber"]
cpu-profiling = ["dep:pprof"]

[lints.clippy]
too_many_arguments = "allow"

[dependencies]
herald-core = { path = "../core" }
herald-api-base = { path = "../api-base" }
herald-api-billing = { path = "../api-billing" }
herald-api-admin = { path = "../api-admin" }
herald-api-auth = { path = "../api-auth" }
herald-api-ext = { path = "../api-ext" }
herald-api-oauth = { path = "../api-oauth" }
herald-api-points = { path = "../api-points" }

# Workspace dependencies
toml = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
axum-valid = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `log` facade for sea-orm ConnectOptions slow-statement logging settings.
log = { workspace = true }
# OpenTelemetry observability (versions/features pinned in backend/Cargo.toml [workspace.dependencies]).
# OTLP/HTTP only — opentelemetry-otlp keeps default-features=false upstream; never add tonic.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
# RED metrics middleware (versions/features pinned in backend/Cargo.toml [workspace.dependencies]).
tower-otel-http-metrics = { workspace = true }
# Phase 2 profiling — optional, default-off, NOT OTel-version-matrix.
# Implementation (ConsoleLayer / pprof sampler endpoint) is intentionally NOT wired this phase.
console-subscriber = { version = "0.5", optional = true }
# pprof is unix-only (libc sigaction/pthread_t); declared under
# [target.'cfg(unix)'.dependencies] below so `--all-features` / `cpu-profiling`
# is a no-op on Windows instead of failing the build.
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
validator = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sea-orm = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
bcrypt = { workspace = true }
clap = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Phase 2 cpu profiling sampler. Unix-only — pprof relies on
# signal/ptrace APIs absent on Windows. Referenced by the `cpu-profiling`
# feature above; on non-unix targets enabling that feature resolves to nothing.
pprof = { version = "0.15", optional = true }

[dev-dependencies]
herald-worker = { path = "../worker" }
herald-test-db = { path = "../test-db" }
herald-test-support = { path = "../test-support" }
test-context = { workspace = true }
hyper = { workspace = true }
tracing-subscriber = { workspace = true }
base32 = { workspace = true }
base64 = { workspace = true }
totp-lite = { workspace = true }
wiremock = { workspace = true }
rsa = "0.9"
aes-gcm = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
urlencoding = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
webauthn-authenticator-rs = { workspace = true, features = ["softtoken"] }
