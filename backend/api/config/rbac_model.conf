[request_definition]
r = dom, sub, obj, act

[policy_definition]
p = dom, sub, obj, act

[role_definition]
# g 策略格式：g, domain, user_id, role
# domain: client_app.id (UUID) 或 "*" (全局通配符)
# user_id: account.id (UUID)
# role: roles.id (UUID) - 角色表的主键 ID（统一使用 UUID，禁止使用角色名称）
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (g(r.dom, r.sub, p.sub) || r.sub == p.sub) && (r.dom == p.dom || p.dom == "*") && r.obj == p.obj && r.act == p.act