[package]
name = "herald-sdk"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust SDK for Herald — multi-tenant auth, billing & points API client"
repository = "https://github.com/timzaak/herald"
readme = "README.md"
keywords = ["herald", "auth", "billing", "sdk"]
categories = ["authentication", "api-bindings", "web-programming"]

[dependencies]
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
moka = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
wiremock.workspace = true
