version: '3.8'

services:
  herald-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: herald-app
    ports:
      - "3000:3000"
    environment:
      - HERALD_CONFIG=/app/config/config.toml
      - DATABASE_URL=postgresql://herald:herald@postgres:5432/herald
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - herald-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: herald-postgres
    environment:
      - POSTGRES_USER=herald
      - POSTGRES_PASSWORD=herald
      - POSTGRES_DB=herald
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - herald-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: herald-redis
    networks:
      - herald-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  herald-network:
    driver: bridge
